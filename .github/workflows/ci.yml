name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: attendance_ai_agent
          POSTGRES_USER: attendance_app
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attendance_app -d attendance_ai_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://attendance_app:ci-only-password@localhost:5432/attendance_ai_agent
      JWT_SECRET_KEY: ci-only-secret-that-is-never-used-outside-tests
      REAL_CALLS_ENABLED: "false"
      EXTERNAL_AI_PROCESSING_APPROVED: "false"
      VOICE_AGENT_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: python -m pytest tests -q
      - run: python -m compileall -q app migrations

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  voice-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-agent
    env:
      REAL_CALLS_ENABLED: "false"
      EXTERNAL_AI_PROCESSING_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: voice-agent/requirements*.txt
      - run: python -m pip install -r requirements-telephony.txt
      - run: python -m pytest tests -q
      - run: python -m compileall -q app migrations
